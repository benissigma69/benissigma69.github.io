<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#080911">
  <title>SWIRL — Start Test</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #080911;
      --text: #f4f5fb;
      --muted: #9b9eaf;
      --cyan: #35ffe8;
      --purple: #a47aff;
      --gold: #ffd16c;
    }

    * { box-sizing: border-box; }

    body {
      min-height: 100vh;
      margin: 0;
      display: grid;
      place-items: center;
      overflow: hidden;
      color: var(--text);
      background:
        radial-gradient(ellipse at 15% 15%, rgba(115,73,208,.24), transparent 40%),
        radial-gradient(ellipse at 85% 85%, rgba(28,195,216,.14), transparent 42%),
        var(--bg);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
    }

    .stars {
      position: fixed;
      inset: 0;
      pointer-events: none;
      background-image:
        radial-gradient(1px 1px at 12% 22%, #ffffffaa 50%, transparent),
        radial-gradient(1px 1px at 78% 17%, #ffffff99 50%, transparent),
        radial-gradient(2px 2px at 55% 72%, #35ffe888 50%, transparent),
        radial-gradient(1px 1px at 88% 63%, #ffffffaa 50%, transparent),
        radial-gradient(1px 1px at 30% 84%, #a47affaa 50%, transparent),
        radial-gradient(1px 1px at 42% 34%, #ffffff77 50%, transparent);
      background-size: 320px 320px;
      animation: drift 40s linear infinite;
    }

    .glow {
      position: fixed;
      width: min(70vw, 620px);
      aspect-ratio: 1;
      border-radius: 50%;
      background: linear-gradient(135deg, var(--purple), var(--cyan));
      filter: blur(130px);
      opacity: .12;
      pointer-events: none;
    }

    main {
      position: relative;
      width: min(680px, calc(100% - 32px));
      padding: clamp(34px, 8vw, 70px) 24px;
      text-align: center;
      border: 1px solid rgba(255,255,255,.11);
      border-radius: 28px;
      background: rgba(18,20,33,.62);
      box-shadow: 0 30px 100px rgba(0,0,0,.44);
      backdrop-filter: blur(16px);
      animation: arrive .8s ease-out both;
    }

    .logo {
      margin: 0;
      font-size: clamp(48px, 12vw, 82px);
      font-weight: 950;
      letter-spacing: -.08em;
      line-height: 1;
      background: linear-gradient(120deg, var(--cyan), var(--gold));
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      filter: drop-shadow(0 0 26px rgba(53,255,232,.2));
    }

    .eyebrow {
      margin: 18px 0 0;
      color: var(--muted);
      font-size: 10px;
      font-weight: 800;
      letter-spacing: .35em;
      text-transform: uppercase;
    }

    h2 {
      margin: 34px 0 10px;
      font-size: clamp(24px, 5vw, 36px);
      letter-spacing: -.04em;
    }

    .description {
      max-width: 430px;
      margin: 0 auto;
      color: var(--muted);
      font-size: 14px;
      line-height: 1.7;
    }

    .start-button {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 13px;
      min-width: min(330px, 100%);
      margin-top: 36px;
      padding: 20px 32px;
      border: 1px solid var(--cyan);
      border-radius: 15px;
      color: #071113;
      background: linear-gradient(115deg, var(--cyan), #75f6db);
      box-shadow: 0 0 35px rgba(53,255,232,.19);
      text-decoration: none;
      font-size: 14px;
      font-weight: 950;
      letter-spacing: .16em;
      transition: transform .2s ease, box-shadow .2s ease, filter .2s ease;
    }

    .start-button:hover {
      transform: translateY(-3px) scale(1.025);
      box-shadow: 0 12px 45px rgba(53,255,232,.32);
      filter: brightness(1.08);
    }

    .start-button:active { transform: scale(.98); }

    .arrow {
      font-size: 21px;
      line-height: 0;
      transition: transform .2s ease;
    }

    .start-button:hover .arrow { transform: translateX(4px); }

    .note {
      margin: 17px 0 0;
      color: #777b8e;
      font-size: 10px;
      letter-spacing: .12em;
    }

    @keyframes drift {
      to { background-position: 320px 160px; }
    }

    @keyframes arrive {
      from { opacity: 0; transform: translateY(14px) scale(.985); }
      to { opacity: 1; transform: translateY(0) scale(1); }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: .01ms !important;
        transition-duration: .01ms !important;
      }
    }
  </style>
</head>
<body>
  <div class="stars" aria-hidden="true"></div>
  <div class="glow" aria-hidden="true"></div>

  <main>
    <h1 class="logo">SWIRL</h1>
    <p class="eyebrow">Your test starts here</p>

    <h2>Ready when you are.</h2>
    <p class="description">
      Take a breath, focus up, and begin the test. You’ll be taken to the test form.
    </p>

    <a
      class="start-button"
      href="https://docs.google.com/forms/d/e/1FAIpQLScaHkQhpRDlGayMQ4ppnwUn2-1CMQee_4pWh6PfZG4z8lp8yQ/viewform?usp=publish-editor"
      target="_blank"
      rel="noopener noreferrer"
    >
      START TEST <span class="arrow" aria-hidden="true">→</span>
    </a>

    <p class="note">OPENS THE TEST IN A NEW TAB</p>
  </main>
</body>
</html>
